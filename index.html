<!doctype html>
<html lang="en" dir="ltr">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#f5f4f0">
<meta name="description" content="Bashir Amri — selected work and creative projects.">
<title>Bashir Amri — Welcome</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;500;600;700&family=DM+Sans:wght@400;500;600;700&family=Playfair+Display:ital,wght@0,500;0,600;1,500&display=swap');
:root{color-scheme:light;--ink:#17191e;--muted:#737780;--paper:#f5f4f0}
*{box-sizing:border-box}html{min-height:100%}body{margin:0;min-height:100svh;background:var(--paper);color:var(--ink);font-family:'DM Sans',sans-serif;overflow-x:hidden}
body:before{content:"";position:fixed;inset:0;pointer-events:none;background:radial-gradient(circle at 50% 38%,#fff 0%,transparent 62%);z-index:0}
main{position:relative;z-index:1;min-height:100svh;max-width:1160px;margin:auto;padding:70px 28px 34px;display:flex;flex-direction:column;justify-content:center}
header{text-align:center;margin-bottom:62px;animation:rise .8s both}
.eyebrow{font:600 11px 'DM Sans',sans-serif;letter-spacing:.28em;text-transform:uppercase;color:#898b8e;margin:0 0 20px}
h1{font-family:'Playfair Display',Georgia,serif;font-size:clamp(44px,6vw,84px);letter-spacing:-.055em;line-height:1.15;margin:0;font-weight:500}h1 em{font-weight:500}
.subtitle{color:var(--muted);font-size:15px;margin:14px 0 0}
.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:20px;direction:ltr}
.card{position:relative;display:flex;flex-direction:column;justify-content:space-between;min-height:310px;padding:32px;border:1px solid #e5e5e1;border-radius:24px;background:#fff;text-decoration:none;color:inherit;overflow:hidden;isolation:isolate;transition:transform .35s cubic-bezier(.2,.8,.2,1),box-shadow .35s,border-color .35s;animation:rise .85s both}
.card:nth-child(2){animation-delay:.12s}.card:hover,.card:focus-visible{transform:translateY(-8px);box-shadow:0 24px 50px #20232b13;border-color:#c8ccd3;outline:none}
.card:before{content:"";position:absolute;width:270px;height:270px;border-radius:50%;right:-85px;top:-115px;background:radial-gradient(circle,#e8e9ff 0%,transparent 72%);opacity:.7;z-index:-1;transition:transform .6s}
.card:nth-child(2):before{background:radial-gradient(circle,#f5e9dd 0%,transparent 72%)}
.card:hover:before{transform:scale(1.5) translate(-20px,20px)}
.top{display:flex;justify-content:space-between;align-items:center}.label{font:600 11px 'DM Sans',sans-serif;letter-spacing:.18em;color:#858992}.arrow{width:42px;height:42px;border:1px solid #e5e6e9;border-radius:50%;display:grid;place-items:center;font-size:22px;transition:background .25s,color .25s,transform .25s}.card:hover .arrow{background:#1b1d24;color:white;transform:rotate(-45deg)}
.content{direction:ltr}.fa-whisper{display:block;margin-top:7px;font:400 12px/1.7 Vazirmatn,sans-serif;color:#9da0a7;opacity:.28;direction:rtl;text-align:left;transition:opacity .3s}.card:hover .fa-whisper{opacity:.48}.content h2{font:600 clamp(35px,4vw,54px)/1.1 'DM Sans',sans-serif;letter-spacing:-.06em;margin:0 0 12px}.content p{font:400 14px/1.6 'DM Sans',sans-serif;color:#777b84;margin:0}
footer{text-align:center;font:500 11px 'DM Sans',sans-serif;letter-spacing:.15em;color:#a3a4a7;margin-top:58px}
@keyframes rise{from{opacity:0;transform:translateY(22px)}to{opacity:1;transform:translateY(0)}}
@media(max-width:680px){main{padding:72px 18px 28px;justify-content:center}header{margin-bottom:38px}.grid{grid-template-columns:1fr;gap:14px}.card{min-height:220px;padding:25px;border-radius:20px}.content h2{font-size:39px}footer{margin-top:38px}}
@media(prefers-reduced-motion:reduce){*,*:before,*:after{animation:none!important;transition:none!important}}
</style>
</head>
<body><main>
<header><p class="eyebrow">BASHIR AMRI / PERSONAL SPACE</p><h1>Welcome to <em>my space.</em></h1><p class="subtitle">A little corner of the internet for what I create.</p></header>
<nav class="grid" aria-label="Main navigation">
<a class="card" href="/studio/"><div class="top"><span class="label">01 / PORTFOLIO</span><span class="arrow" aria-hidden="true">↗</span></div><div class="content"><h2>My Work</h2><p>Selected creative work &amp; portfolio</p><span class="fa-whisper" lang="fa">نمونه‌کارهای من</span></div></a>
<a class="card" href="/Alfalink/"><div class="top"><span class="label">02 / EXPLORE</span><span class="arrow" aria-hidden="true">↗</span></div><div class="content"><h2>My Projects</h2><p>Experiments, ideas &amp; side projects</p><span class="fa-whisper" lang="fa">پروژه‌های من</span></div></a>
</nav><footer>© <span id="year">2026</span> BASHIR AMRI</footer>
</main><script>document.getElementById('year').textContent=new Date().getFullYear()</script></body></html>
